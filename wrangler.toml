name = "accounting-system-api"
main = "server/worker.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# 部署前先執行：
#   npx wrangler d1 create accounting-system-db
# 把輸出的 database_id 貼到下面 database_id = "..." 這一行
[[d1_databases]]
binding = "DB"
database_name = "accounting-system-db"
database_id = "deeae71d-a6bb-4fcc-81c2-0b5b17b939f4"

# 機密環境變數（JWT_SECRET / ADMIN_EMAIL / ADMIN_PASSWORD）請用以下指令個別設定，
# 不要寫在這個檔案裡（這個檔案通常會被提交到 git）：
#   npx wrangler secret put JWT_SECRET
#   npx wrangler secret put ADMIN_EMAIL
#   npx wrangler secret put ADMIN_PASSWORD

#   LINE 通知（見 server/lineNotify.ts）：
#   npx wrangler secret put LINE_CHANNEL_ACCESS_TOKEN
#   npx wrangler secret put LINE_NOTIFY_TO

# 每天台灣時間早上 9 點（UTC 01:00）：記定期收支、帳務檢查、官網對帳，有事才發 LINE（server/dailyJob.ts）
[triggers]
crons = ["0 1 * * *"]

# 公開設定（不是機密）：Google 登入的 OAuth 用戶端 ID（Google Cloud 專案 leviax-finance，2026-10-29 建立）
[vars]
# 只收「新訂單」LINE 通知的人（出貨員余彩霞 THYu，2026-11-16）；狀態改變、每日提醒不發。多人用逗號分開
LINE_NEW_ORDER_TO = "Ue696b63c3e699d70fefce81182cedebe"
GOOGLE_CLIENT_ID = "355603392015-ftr9j4g2rs2ce593e5njtm967qhq2s4g.apps.googleusercontent.com"
